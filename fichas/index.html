<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas de Rescate · Patrimonio · Bomberos Los Palacios</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--rojo:#8B1A1A;--rojo-dark:#5C0F0F;--naranja:#C05000;--verde:#166534;--gris-oscuro:#1A1A1A;--gris-medio:#2D2D2D;--gris-panel:#F5F2EE;--gris-borde:#DDD8D0;--texto:#1A1A1A;--texto-muted:#6B6560;--blanco:#FFFEF9;--crema:#F9F6F0;--font-display:'Oswald',sans-serif;--font-body:'Source Serif 4',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-body);background:var(--crema);color:var(--texto);height:100vh;overflow:hidden;display:flex;flex-direction:column}

/* CABECERA */
.cabecera{background:var(--gris-oscuro);border-bottom:4px solid var(--rojo);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100}
.cab-izq{display:flex;align-items:center;gap:14px}
.cab-emblema{width:38px;height:38px;border:2px solid var(--rojo);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px}
.cab-titulo{font-family:var(--font-display);font-size:13px;font-weight:600;color:#fff;letter-spacing:.1em;text-transform:uppercase}
.cab-sub{font-size:11px;color:rgba(255,255,255,.4);font-family:var(--font-display);letter-spacing:.06em;margin-top:1px}
.cab-der{display:flex;gap:6px;align-items:center}
.cab-btn{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:3px;cursor:pointer;color:rgba(255,255,255,.5);background:transparent;transition:all .2s;text-decoration:none;display:inline-block}
.cab-btn:hover{color:white;border-color:rgba(255,255,255,.4)}
.cab-btn.active{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.cab-btn.portal{color:rgba(255,255,255,.4);border-color:rgba(255,255,255,.15)}
.cab-btn.portal:hover{color:white}
.cab-sep{width:1px;height:20px;background:rgba(255,255,255,.1);margin:0 2px}

/* SELECTOR EDIFICIO */
#pantalla-selector{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;background:var(--crema);overflow-y:auto}
.sel-titulo{font-family:var(--font-display);font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--rojo);margin-bottom:8px;text-align:center}
.sel-sub{font-size:14px;color:var(--texto-muted);margin-bottom:36px;text-align:center}
.sel-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;max-width:900px;width:100%}
.sel-card{background:var(--blanco);border:1px solid var(--gris-borde);border-radius:6px;overflow:hidden;cursor:pointer;transition:all .2s}
.sel-card:hover{border-color:var(--rojo);box-shadow:0 6px 20px rgba(139,26,26,.15);transform:translateY(-2px)}
.sel-card-img{width:100%;height:140px;object-fit:cover;background:var(--gris-panel)}
.sel-card-img-ph{width:100%;height:140px;background:linear-gradient(135deg,#2D1A1A,#1A1A1A);display:flex;align-items:center;justify-content:center;font-size:40px}
.sel-card-body{padding:14px 16px}
.sel-card-tipo{font-family:var(--font-display);font-size:10px;font-weight:600;color:var(--rojo);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.sel-card-nombre{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--texto);text-transform:uppercase;letter-spacing:.04em;line-height:1.2;margin-bottom:6px}
.sel-card-meta{display:flex;gap:10px;align-items:center}
.sel-card-num{font-size:12px;color:var(--texto-muted)}
.sel-card-prior{font-family:var(--font-display);font-size:10px;font-weight:700;padding:2px 8px;border-radius:2px;background:#FEE2E2;color:#7F1D1D}
.cargando-sel{font-family:var(--font-display);font-size:13px;color:var(--texto-muted);letter-spacing:.08em;text-transform:uppercase}

/* LAYOUT FICHAS */
#pantalla-fichas{display:none;flex:1;overflow:hidden}
.layout{display:flex;height:100%}
.panel{width:260px;flex-shrink:0;background:var(--gris-medio);overflow-y:auto;border-right:1px solid rgba(255,255,255,.06)}
.panel::-webkit-scrollbar{width:3px}
.panel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1)}
.panel-zona{padding:8px 12px 4px;font-family:var(--font-display);font-size:9px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:.14em;text-transform:uppercase;border-top:1px solid rgba(255,255,255,.06);margin-top:4px}
.panel-zona:first-child{border-top:none;margin-top:0}
.bien-item{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .15s;border-bottom:1px solid rgba(255,255,255,.04)}
.bien-item:hover{background:rgba(255,255,255,.05)}
.bien-item.active{background:rgba(139,26,26,.3);border-left:3px solid var(--rojo);padding-left:9px}
.bien-thumb{width:36px;height:36px;border-radius:3px;object-fit:cover;flex-shrink:0}
.bien-thumb-ph{width:36px;height:36px;border-radius:3px;flex-shrink:0;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:14px}
.bien-info{flex:1;min-width:0}
.bien-nombre-panel{font-family:var(--font-display);font-size:12px;font-weight:500;color:rgba(255,255,255,.85);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bien-num-panel{font-family:var(--font-display);font-size:10px;color:var(--rojo);letter-spacing:.04em;margin-top:1px}
.main{flex:1;overflow-y:auto;background:var(--crema)}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15)}

/* FICHA INDIVIDUAL */
.ficha-hero{position:relative;height:240px;overflow:hidden;background:var(--gris-oscuro)}
.ficha-hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.ficha-hero-ph{width:100%;height:100%;background:linear-gradient(135deg,#2D1A1A,#1A1A1A);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.ph-icon{font-size:52px;color:rgba(255,255,255,.08)}
.ph-label{font-family:var(--font-display);font-size:11px;color:rgba(255,255,255,.2);letter-spacing:.1em;text-transform:uppercase}
.ficha-hero-overlay{position:absolute;bottom:0;left:0;right:0;padding:18px 24px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.ficha-num{font-family:var(--font-display);font-size:11px;font-weight:600;color:var(--rojo);letter-spacing:.12em;text-transform:uppercase;margin-bottom:3px}
.ficha-nombre{font-family:var(--font-display);font-size:22px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.ficha-autor{font-size:12px;color:rgba(255,255,255,.5);font-style:italic;margin-top:3px}
.badge-rescate{position:absolute;top:14px;right:14px;font-family:var(--font-display);font-size:11px;font-weight:700;padding:5px 12px;border-radius:2px;letter-spacing:.08em;text-transform:uppercase}
.badge-r1{background:var(--rojo);color:white}
.badge-r2{background:var(--naranja);color:white}
.badge-r3{background:#854D0E;color:white}
.badge-ri{background:#374151;color:#D1D5DB}
.badge-upload{position:absolute;top:14px;left:14px;font-family:var(--font-display);font-size:10px;font-weight:600;padding:4px 10px;border-radius:2px;letter-spacing:.06em;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.3);color:white;cursor:pointer;transition:background .15s;display:none}
.badge-upload.admin-visible{display:block}
.badge-upload:hover{background:rgba(139,26,26,.7)}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--gris-oscuro);border-bottom:3px solid var(--rojo)}
.stat{padding:10px 12px;text-align:center;border-right:1px solid rgba(255,255,255,.07)}
.stat:last-child{border-right:none}
.stat-val{font-family:var(--font-display);font-size:18px;font-weight:700;color:#fff;line-height:1}
.stat-key{font-family:var(--font-display);font-size:9px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.seccion{background:var(--blanco);margin-bottom:6px}
.sec-header{padding:8px 18px;border-bottom:1px solid var(--gris-borde);font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--texto-muted);display:flex;align-items:center;gap:10px}
.sec-header::after{content:'';flex:1;height:1px;background:var(--gris-borde)}
.sec-grid{display:grid;grid-template-columns:1fr 1fr}
.cb{padding:10px 16px;border-bottom:1px solid var(--gris-borde);border-right:1px solid var(--gris-borde)}
.cb:nth-child(even){border-right:none}
.cb.full{grid-column:1/-1;border-right:none}
.cl{font-family:var(--font-display);font-size:9px;font-weight:700;color:var(--texto-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.cv{font-size:13px;color:var(--texto);line-height:1.5}
.cv.alert{color:var(--rojo);font-weight:600}
.cv.warn{color:var(--naranja);font-weight:600}
.personas-num{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--texto);line-height:1}
.personas-sub{font-size:12px;color:var(--texto-muted);margin-top:2px}
.riesgo-chip{display:inline-block;font-family:var(--font-display);font-size:11px;font-weight:600;padding:3px 9px;border-radius:2px;margin:2px 2px 2px 0;letter-spacing:.04em}
.riesgo-fuego{background:#FEE2E2;color:#7F1D1D}
.riesgo-agua{background:#DBEAFE;color:#1E3A5F}
.riesgo-estruc{background:#FEF3C7;color:#78350F}
.riesgo-mani{background:#F3E8FF;color:#4A1D96}
.riesgo-inam{background:#F0FDF4;color:#14532D;border:1px solid #86EFAC}
.alerta-box{display:flex;gap:10px;padding:12px 16px;border-left:4px solid var(--rojo);background:#FFF5F5;font-size:13px;color:#5C0F0F;line-height:1.5}
.zona-mapa{background:var(--gris-panel);padding:12px 18px;display:flex;align-items:center;gap:14px}
.zona-valor{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--rojo);letter-spacing:.04em}
.sec-body{padding:12px 18px}

/* VISTA EDIFICIO */
.vista-edificio{padding:20px}
.edificio-titulo{font-family:var(--font-display);font-size:20px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--rojo);margin-bottom:4px}
.edificio-sub{font-size:13px;color:var(--texto-muted);margin-bottom:20px}
.zona-grupo{margin-bottom:20px}
.zona-titulo{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--gris-oscuro);padding:6px 12px;margin-bottom:8px}
.grid-bienes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bien-card{background:var(--blanco);border:1px solid var(--gris-borde);border-radius:4px;overflow:hidden;cursor:pointer;transition:all .15s}
.bien-card:hover{border-color:var(--rojo);transform:translateY(-1px);box-shadow:0 4px 12px rgba(139,26,26,.15)}
.bien-card-img{width:100%;height:90px;object-fit:cover;background:var(--gris-panel)}
.bien-card-ph{width:100%;height:90px;background:var(--gris-panel);display:flex;align-items:center;justify-content:center;font-size:22px;flex-direction:column;gap:4px}
.bien-card-ph span{font-family:var(--font-display);font-size:9px;color:var(--texto-muted);letter-spacing:.06em}
.bien-card-body{padding:8px 10px}
.bien-card-num{font-family:var(--font-display);font-size:10px;color:var(--rojo);font-weight:700;letter-spacing:.06em;margin-bottom:2px}
.bien-card-nombre{font-family:var(--font-display);font-size:12px;font-weight:500;color:var(--texto);line-height:1.3}
.bien-card-ubi{font-size:10px;color:var(--texto-muted);margin-top:2px}
.bien-card-badges{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}

/* LOGIN BADGE */
.admin-badge{font-size:11px;color:#86EFAC;background:rgba(22,101,52,.2);border:1px solid rgba(22,101,52,.3);padding:4px 10px;border-radius:20px;display:none}
.login-btn-cab{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5);padding:5px 12px;border-radius:3px;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:all .2s}
.login-btn-cab:hover{color:white;background:rgba(255,255,255,.12)}

/* MODAL LOGIN */
#modal-login{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9000;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#modal-login.visible{display:flex}
.login-box{background:#1E1E1E;border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:28px;width:320px;max-width:90vw}
.login-titulo{font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:.06em;color:#fff;margin-bottom:6px}
.login-desc{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:20px;line-height:1.4}
.login-input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:4px;color:#fff;padding:10px 12px;font-size:14px;margin-bottom:10px;font-family:var(--font-body)}
.login-input:focus{outline:none;border-color:var(--rojo)}
.login-input::placeholder{color:rgba(255,255,255,.25)}
.login-submit{width:100%;background:var(--rojo);border:none;color:white;padding:11px;border-radius:4px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.06em;cursor:pointer;text-transform:uppercase}
.login-submit:disabled{background:#444;cursor:not-allowed}
.login-msg{font-size:12px;text-align:center;margin-top:10px;min-height:16px;color:rgba(255,255,255,.4)}
.login-cerrar{float:right;background:none;border:none;color:rgba(255,255,255,.4);font-size:20px;cursor:pointer;margin-top:-4px}

/* TOAST */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:9px 18px;border-radius:30px;font-size:13px;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);font-family:var(--font-display);letter-spacing:.04em}


/* MODAL EDICION BIEN */
#modal-bien{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:9000;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px;backdrop-filter:blur(4px)}
#modal-bien.visible{display:flex}
.bien-form{background:var(--blanco);border-radius:6px;padding:24px;width:620px;max-width:95vw;margin:auto;position:relative}
.bien-form-titulo{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--rojo);margin-bottom:16px;padding-right:30px}
.bf-cerrar{position:absolute;top:16px;right:16px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--texto-muted)}
.bf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bf-campo{display:flex;flex-direction:column;gap:3px}
.bf-campo.full{grid-column:span 2}
.bf-label{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texto-muted)}
.bf-input{border:1px solid var(--gris-borde);border-radius:3px;padding:8px 10px;font-family:var(--font-body);font-size:13px;color:var(--texto);background:var(--crema);width:100%}
.bf-input:focus{outline:none;border-color:var(--rojo)}
.bf-textarea{resize:vertical;min-height:70px}
.bf-select{border:1px solid var(--gris-borde);border-radius:3px;padding:8px 10px;font-family:var(--font-body);font-size:13px;background:var(--crema);width:100%}
.bf-divider{grid-column:span 2;border:none;border-top:1px solid var(--gris-borde);margin:4px 0}
.bf-acciones{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.bf-btn-guardar{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;background:var(--rojo);color:white;border:none;cursor:pointer;border-radius:2px}
.bf-btn-guardar:disabled{background:#999;cursor:not-allowed}
.bf-btn-cancelar{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:10px 20px;background:var(--gris-panel);color:var(--texto-muted);border:1px solid var(--gris-borde);cursor:pointer;border-radius:2px}
.bf-btn-borrar{font-family:var(--font-display);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:10px 16px;background:#FEE2E2;color:#7F1D1D;border:1px solid #FECACA;cursor:pointer;border-radius:2px}
.bf-riesgos{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.bf-riesgo-cb{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
.bf-foto-preview{width:100%;height:120px;object-fit:cover;border-radius:3px;margin-bottom:8px;display:none}
.bf-nuevo-btn{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;background:var(--gris-oscuro);color:white;border:none;cursor:pointer;border-radius:2px;margin-bottom:12px}

/* PRINT */

@media(max-width:700px){
  .panel{width:100%;height:180px;border-right:none;border-bottom:1px solid rgba(255,255,255,.06);overflow-x:auto;overflow-y:hidden;display:flex;flex-direction:column}
  .layout{flex-direction:column}
  .main{overflow-y:auto}
  .grid-bienes{grid-template-columns:1fr 1fr}
  .stats-strip{grid-template-columns:1fr 1fr}
  .ficha-nombre{font-size:16px}
  .cabecera{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px}
  .cab-der{flex-wrap:wrap;gap:4px}
  .cab-btn{font-size:10px;padding:4px 8px}
  .sel-grid{grid-template-columns:1fr}
  .bf-grid{grid-template-columns:1fr}
  .bf-campo.full{grid-column:span 1}
  .bf-divider{display:none}
}

@media print{.cabecera,.panel,.cab-der{display:none!important}.layout{display:block;height:auto}.main{overflow:visible}.stats-strip,.badge-rescate{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

@media(max-width:700px){
  .panel{width:220px}
  .grid-bienes{grid-template-columns:1fr 1fr}
  .stats-strip{grid-template-columns:1fr 1fr}
  .sel-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="cabecera">
  <div class="cab-izq">
    <div class="cab-emblema">🔥</div>
    <div>
      <div class="cab-titulo" id="cab-titulo">Fichas de Rescate · Patrimonio</div>
      <div class="cab-sub" id="cab-sub">Los Palacios y Villafranca · Parque de Bomberos</div>
    </div>
  </div>
  <div class="cab-der">
    <a href="../patrimonio/index.html" class="cab-btn portal">← Patrimonio</a>
    <div class="cab-sep"></div>
    <button class="cab-btn active" id="btn-ficha" onclick="setVista('ficha')" style="display:none">Ficha individual</button>
    <button class="cab-btn" id="btn-edificio" onclick="setVista('edificio')" style="display:none">Vista edificio</button>
    <button class="cab-btn" id="btn-volver" onclick="volverSelector()" style="display:none">↩ Edificios</button>
    <button class="cab-btn" onclick="window.print()" style="display:none" id="btn-imprimir">🖨 Imprimir</button>
    <div class="cab-sep"></div>
    <span class="admin-badge" id="admin-badge"></span>
    <button class="login-btn-cab" id="btn-login" onclick="abrirLogin()">🔐 Acceso</button>
  </div>
</div>

<!-- SELECTOR DE EDIFICIO -->
<div id="pantalla-selector">
  <div class="sel-titulo">Fichas de Rescate</div>
  <div class="sel-sub">Selecciona el edificio patrimonial</div>
  <div class="sel-grid" id="sel-grid">
    <div class="cargando-sel">Cargando edificios...</div>
  </div>
</div>

<!-- PANTALLA FICHAS -->
<div id="pantalla-fichas">
  <div class="layout">
    <div class="panel" id="panel-lateral"></div>
    <div class="main" id="main-content"></div>
  </div>
</div>

<!-- MODAL LOGIN -->
<div id="modal-login">
  <div class="login-box">
    <button class="login-cerrar" onclick="cerrarLogin()">×</button>
    <div class="login-titulo">🔐 Acceso Admin</div>
    <div class="login-desc">Solo el administrador puede añadir y editar fichas.</div>

async function cargarEdificios(){
  try {
    const r = await fetch(`${SB}/rest/v1/patrimonio?select=id,nombre,tipo,prioridad,minutos,km,imagen_url&order=prioridad.asc,nombre.asc`,{headers:H()});
    const data = await r.json();
    if(TOKEN) await verificarSeed();
    renderSelector(data);
  } catch(e){
    document.getElementById('sel-grid').innerHTML = '<div class="cargando-sel">Error de conexión</div>';
  }
}

async function verificarSeed(){
  try {
    const r = await fetch(`${SB}/rest/v1/bienes_muebles?select=id&limit=1`,{headers:H()});
    const data = await r.json();
    if(data.length === 0){
      // Sembrar datos
      await fetch(`${SB}/rest/v1/bienes_muebles`,{
        method:'POST',
        headers:{...H(),'Prefer':'return=minimal'},
        body:JSON.stringify(SEED_BIENES)
      });
    }
  } catch(e){}
}

  const sel = document.getElementById('sel-grid');
  if(!edificios.length){ sel.innerHTML='<div class="cargando-sel">Sin edificios registrados</div>'; return; }
  sel.innerHTML = edificios.map(e=>`
    <div class="sel-card" onclick="abrirEdificio('${e.id}','${e.nombre.replace(/'/g,"\\'")}')">
      ${e.imagen_url
        ? `<img class="sel-card-img" src="${e.imagen_url}" alt="${e.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
        : ''}
      <div class="sel-card-img-ph" ${e.imagen_url?'style="display:none"':''}>🏛️</div>
      <div class="sel-card-body">
        <div class="sel-card-tipo">${e.tipo||'Edificio patrimonial'}</div>
        <div class="sel-card-nombre">${e.nombre}</div>
        <div class="sel-card-meta">
          <span class="sel-card-num">${e.minutos!=='—'?e.minutos+' min · '+e.km+' km':'Datos pendientes'}</span>
          <span class="sel-card-prior">Prioridad ${e.prioridad||'A'}</span>
        </div>
      </div>
    </div>
  `).join('');
}

async function abrirEdificio(id, nombre){
  edificioActual = id;
  document.getElementById('cab-titulo').textContent = 'Fichas de Rescate · Patrimonio';
  document.getElementById('cab-sub').textContent = nombre + ' · Los Palacios y Villafranca';
  // Mostrar botones
  ['btn-ficha','btn-edificio','btn-volver','btn-imprimir'].forEach(b=>{
    document.getElementById(b).style.display='inline-block';
  });
  // Cambiar pantallas
  document.getElementById('pantalla-selector').style.display='none';
  document.getElementById('pantalla-fichas').style.display='block';
  // Cargar bienes
  await cargarBienes(id);
}

function volverSelector(){
  document.getElementById('pantalla-selector').style.display='flex';
  document.getElementById('pantalla-fichas').style.display='none';
  ['btn-ficha','btn-edificio','btn-volver','btn-imprimir'].forEach(b=>{
    document.getElementById(b).style.display='none';
  });
  edificioActual = null;
  bienesActuales = [];
}

// ============================================
// BIENES
// ============================================
async function cargarBienes(edificioId){
  try {
    const r = await fetch(`${SB}/rest/v1/bienes_muebles?patrimonio_id=eq.${edificioId}&select=*&order=orden_rescate.asc,nombre.asc`,{headers:H()});
    bienesActuales = await r.json();
  } catch(e){ bienesActuales = []; }
  renderPanel();
  if(bienesActuales.length > 0){
    seleccionado = bienesActuales[0].id;
    setVista('ficha');
  }
}

function renderPanel(){
  const zonas = [...new Set(bienesActuales.map(b=>b.zona))];
  document.getElementById('panel-lateral').innerHTML = zonas.map(zona=>`
    <div class="panel-zona">${zona}</div>
    ${bienesActuales.filter(b=>b.zona===zona).map(b=>`
      <div class="bien-item ${b.id===seleccionado?'active':''}" id="pi-${b.id}" onclick="seleccionar('${b.id}')">
        ${b.foto_url
          ? `<img class="bien-thumb" src="${b.foto_url}" alt="" onerror="this.style.display='none'">`
          : `<div class="bien-thumb-ph">🎨</div>`}
        <div class="bien-info">
          <div class="bien-nombre-panel">${b.nombre}</div>
          <div class="bien-num-panel">${rescateLabel[b.rescate_codigo]||b.rescate_codigo}</div>
        </div>
      </div>
    `).join('')}
  `).join('');
}

function seleccionar(id){
  seleccionado = id;
  document.querySelectorAll('.bien-item').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('pi-'+id);
  if(el) el.classList.add('active');
  if(vista==='ficha') mostrarFicha(id);
}

function setVista(v){
  vista = v;
  document.getElementById('btn-ficha').classList.toggle('active', v==='ficha');
  document.getElementById('btn-edificio').classList.toggle('active', v==='edificio');
  if(v==='ficha') mostrarFicha(seleccionado);
  else mostrarEdificio();
}

function mostrarFicha(id){
  const b = bienesActuales.find(x=>x.id===id);

  const riesgos = Array.isArray(b.riesgos) ? b.riesgos : [];

  const rescCode = b.rescate_codigo || 'R1';

  document.getElementById('main-content').innerHTML = `
    <div>

        ${b.foto_url ? `<img src="${b.foto_url}" alt="${b.nombre}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : ''}
        <div class="ficha-hero-ph" ${b.foto_url?'style="display:none"':''}>
          <div class="ph-icon">🎨</div>
          <div class="ph-label">Foto pendiente de añadir</div>
        </div>
        <div class="ficha-hero-overlay">
          <div class="ficha-num">${document.getElementById('cab-sub').textContent.split(' · ')[0]} · ${b.zona}</div>
          <div class="ficha-nombre">${b.nombre}</div>
          <div class="ficha-autor">${b.autor||''}</div>
        </div>
        <div class="badge-rescate ${rescateClass[rescCode]||'badge-ri'}">${rescateLabel[rescCode]||rescCode}</div>
        <button class="badge-upload${USUARIO?' admin-visible':''}" onclick="subirFotoBien('${b.id}')">📷 Añadir foto</button>
      </div>
      <div class="stats-strip">
        <div class="stat">
          <div class="stat-val" style="color:${rescCode==='R1'?'#EF4444':rescCode==='R2'?'#F97316':rescCode==='RI'?'#6B7280':'#D97706'}">${esInam?'—':rescCode}</div>
          <div class="stat-key">Prioridad</div>
        </div>
        <div class="stat">
          <div class="stat-val" style="font-size:${(b.personas||'').length>4?'14px':'18px'};padding-top:${(b.personas||'').length>4?'4px':'0'}">${b.personas||'—'}</div>
          <div class="stat-key">Personas</div>
        </div>
        <div class="stat">
          <div class="stat-val" style="font-size:12px;padding-top:4px">${riesgos.map(r=>riesgoLabels[r]||r).join(' / ')||'—'}</div>
          <div class="stat-key">Riesgos</div>
        </div>
        <div class="stat">
          <div class="stat-val" style="font-size:12px;padding-top:3px">${(b.zona||'').split(' — ')[0].split(' — ')[0].substring(0,18)}</div>
          <div class="stat-key">Zona</div>
        </div>
      </div>
      <div class="seccion">
        <div class="sec-header">Ubicación en el edificio</div>
        <div class="zona-mapa"><div><div class="cl">Localización exacta</div><div class="zona-valor">${b.ubicacion||'—'}</div></div></div>
      </div>
      <div class="seccion">
        <div class="sec-header">Datos del bien</div>
        <div class="sec-grid">
          <div class="cb"><div class="cl">Tipo / Tipología</div><div class="cv">${b.tipo||'—'}</div></div>
          <div class="cb"><div class="cl">Cronología</div><div class="cv">${b.cronologia||'—'}</div></div>
          <div class="cb"><div class="cl">Peso estimado</div><div class="cv ${b.peso==='INAMOVIBLE'?'alert':''}">${b.peso||'—'}</div></div>
          <div class="cb"><div class="cl">Dimensiones</div><div class="cv ${b.dimensiones==='INAMOVIBLE'?'alert':''}">${b.dimensiones||'—'}</div></div>
          <div class="cb full"><div class="cl">Material / Fragilidad</div><div class="cv">${b.material||'—'}</div></div>
        </div>
      </div>
      <div class="seccion">
        <div class="sec-header">Para la intervención</div>
        <div class="sec-grid">
          <div class="cb"><div class="cl">Personas necesarias</div>${esInam?`<div class="cv alert">NO RESCATAR</div>`:`<div class="personas-num">${b.personas||'—'}</div><div class="personas-sub">personas mínimo</div>`}</div>
          <div class="cb"><div class="cl">Riesgos específicos</div><div style="margin-top:4px">${chips||'—'}</div></div>
          <div class="cb full"><div class="cl">Notas especiales de manipulación</div><div class="cv">${b.notas||'—'}</div></div>
        </div>
      </div>
      ${esInam?`<div class="seccion"><div class="alerta-box"><span>⚠️</span><div>BIEN INAMOVIBLE — No intentar trasladar. Proteger in situ con mantas ignífugas y comunicar al mando su localización exacta.</div></div></div>`:''}
      <div class="seccion" style="margin-bottom:0">
        <div class="sec-header">Contacto</div>

          <div class="cl">Responsable del bien</div>

          <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
            <button style="font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;background:var(--rojo);color:white;border:none;cursor:pointer;border-radius:2px" onclick="window.print()">🖨 Imprimir ficha</button>
            ${USUARIO?`<button style="font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;background:rgba(139,26,26,.12);color:var(--rojo);border:1px solid rgba(139,26,26,.2);cursor:pointer;border-radius:2px" onclick="editarBien('${b.id}')">✏️ Editar ficha</button><button style="font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 16px;background:#F0FDF4;color:#166534;border:1px solid #86EFAC;cursor:pointer;border-radius:2px" onclick="abrirFormNuevoBien()">+ Añadir bien</button>`:''}

function mostrarEdificio(){
  const zonas = [...new Set(bienesActuales.map(b=>b.zona))];
  const nombre = document.getElementById('cab-sub').textContent.split(' · ')[0];
  document.getElementById('main-content').innerHTML = `
    <div class="vista-edificio">
      <div class="edificio-titulo">${nombre}</div>
      <div class="edificio-sub" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <span>Fichas de rescate — ${bienesActuales.length} bienes catalogados · Haz clic en un bien para ver su ficha</span>
        ${USUARIO?`<button class="bf-nuevo-btn" onclick="abrirFormNuevoBien()">+ Añadir bien</button>`:''}
      </div>
      ${zonas.map(zona=>`
        <div class="zona-grupo">
          <div class="zona-titulo">${zona}</div>
          <div class="grid-bienes">
            ${bienesActuales.filter(b=>b.zona===zona).map(b=>`
              <div class="bien-card" onclick="seleccionar('${b.id}');setVista('ficha')">
                ${b.foto_url
                  ? `<img class="bien-card-img" src="${b.foto_url}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                  : ''}
                <div class="bien-card-ph" ${b.foto_url?'style="display:none"':''}><span>🎨</span><span>Foto pendiente</span></div>
                <div class="bien-card-body">
                  <div class="bien-card-num">${rescateLabel[b.rescate_codigo]||b.rescate_codigo}</div>
                  <div class="bien-card-nombre">${b.nombre}</div>
                  <div class="bien-card-ubi">${b.ubicacion||''}</div>
                  <div class="bien-card-badges">
                    ${(Array.isArray(b.riesgos)?b.riesgos:[]).map(r=>`<span class="riesgo-chip ${riesgoClass[r]||''}" style="font-size:9px;padding:1px 5px">${riesgoLabels[r]||r}</span>`).join('')}
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

// ============================================
// SUBIDA DE FOTOS
// ============================================
function subirFotoBien(id){
  subiendoBienId = id;
  document.getElementById('input-foto').click();
}

document.getElementById('input-foto').addEventListener('change', async function(){
  const file = this.files[0];
  if(!file || !subiendoBienId) return;
  mostrarToast('📤 Subiendo foto...');
  const ext = file.name.split('.').pop();
  const path = `${subiendoBienId}/${Date.now()}.${ext}`;
  try {
    const r = await fetch(`${SB}/storage/v1/object/bienes-fotos/${path}`,{
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+TOKEN,'Content-Type':file.type},
      body:file
    });
    if(r.ok){
      const url = `${SB}/storage/v1/object/public/bienes-fotos/${path}`;
      await fetch(`${SB}/rest/v1/bienes_muebles?id=eq.${subiendoBienId}`,{
        method:'PATCH',
        headers:{...H(),'Prefer':'return=minimal'},
        body:JSON.stringify({foto_url:url,updated_at:new Date().toISOString()})
      });
      const b = bienesActuales.find(x=>x.id===subiendoBienId);
      if(b) b.foto_url = url;
      renderPanel();
      mostrarFicha(subiendoBienId);
      mostrarToast('✅ Foto añadida correctamente');
    } else { mostrarToast('❌ Error al subir la foto'); }
  } catch(e){ mostrarToast('❌ Error de conexión'); }
  this.value = '';
});

// ============================================
// EDITAR / AÑADIR BIEN
// ============================================
let editandoBienId = null;

function editarBien(id){
  const b = bienesActuales.find(x=>x.id===id);
  if(!b) return;
  editandoBienId = id;
  document.getElementById('bf-titulo').textContent = 'Editar bien — '+b.nombre;
  document.getElementById('bf-nombre').value = b.nombre||'';
  document.getElementById('bf-zona').value = b.zona||'';
  document.getElementById('bf-ubicacion').value = b.ubicacion||'';
  document.getElementById('bf-rescate').value = b.rescate_codigo||'R1';
  document.getElementById('bf-orden').value = b.orden_rescate||'';
  document.getElementById('bf-autor').value = b.autor||'';
  document.getElementById('bf-cronologia').value = b.cronologia||'';
  document.getElementById('bf-tipo').value = b.tipo||'';
  document.getElementById('bf-material').value = b.material||'';
  document.getElementById('bf-personas').value = b.personas||'';
  document.getElementById('bf-peso').value = b.peso||'';
  document.getElementById('bf-dimensiones').value = b.dimensiones||'';
  document.getElementById('bf-notas').value = b.notas||'';
  document.getElementById('bf-contacto').value = b.contacto||'';
  const riesgos = Array.isArray(b.riesgos)?b.riesgos:[];
  ['fuego','agua','estruc','mani','inam'].forEach(r=>{
    document.getElementById('bf-r-'+r).checked = riesgos.includes(r);
  });
  document.getElementById('bf-btn-borrar').style.display='inline-block';
  document.getElementById('modal-bien').classList.add('visible');
}

function abrirFormNuevoBien(){
  if(!editandoBienId===null) editandoBienId = null;
  editandoBienId = null;
  document.getElementById('bf-titulo').textContent = '➕ Añadir nuevo bien';
  ['bf-nombre','bf-zona','bf-ubicacion','bf-autor','bf-cronologia','bf-tipo','bf-material','bf-personas','bf-peso','bf-dimensiones','bf-notas','bf-contacto'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('bf-rescate').value='R1';
  document.getElementById('bf-orden').value='';
  ['fuego','agua','estruc','mani','inam'].forEach(r=>document.getElementById('bf-r-'+r).checked=false);
  document.getElementById('bf-btn-borrar').style.display='none';
  document.getElementById('modal-bien').classList.add('visible');
}

function cerrarModalBien(){
  document.getElementById('modal-bien').classList.remove('visible');
  editandoBienId = null;
}

async function guardarBien(){
  const nombre = document.getElementById('bf-nombre').value.trim();
  if(!nombre){ mostrarToast('⚠️ El nombre es obligatorio'); return; }
  const riesgos = ['fuego','agua','estruc','mani','inam'].filter(r=>document.getElementById('bf-r-'+r).checked);
  const datos = {
    nombre,
    zona: document.getElementById('bf-zona').value.trim()||null,
    ubicacion: document.getElementById('bf-ubicacion').value.trim()||null,
    rescate_codigo: document.getElementById('bf-rescate').value,
    orden_rescate: parseInt(document.getElementById('bf-orden').value)||99,
    autor: document.getElementById('bf-autor').value.trim()||null,
    cronologia: document.getElementById('bf-cronologia').value.trim()||null,
    tipo: document.getElementById('bf-tipo').value.trim()||null,
    material: document.getElementById('bf-material').value.trim()||null,
    personas: document.getElementById('bf-personas').value.trim()||null,
    peso: document.getElementById('bf-peso').value.trim()||null,
    dimensiones: document.getElementById('bf-dimensiones').value.trim()||null,
    notas: document.getElementById('bf-notas').value.trim()||null,
    contacto: document.getElementById('bf-contacto').value.trim()||null,
    riesgos,
    updated_at: new Date().toISOString()
  };
  const btn = document.getElementById('bf-btn-guardar');
  btn.disabled=true; btn.textContent='Guardando...';
  try {
    if(editandoBienId){
      const r = await fetch(`${SB}/rest/v1/bienes_muebles?id=eq.${editandoBienId}`,{
        method:'PATCH',
        headers:{...H(),'Prefer':'return=representation'},
        body:JSON.stringify(datos)
      });
      if(!r.ok) throw new Error(await r.text());
      const [updated] = await r.json();
      const idx = bienesActuales.findIndex(x=>x.id===editandoBienId);
      if(idx>=0) bienesActuales[idx]={...bienesActuales[idx],...updated};
      mostrarToast('✅ Bien actualizado');
      cerrarModalBien();
      renderPanel();
      mostrarFicha(editandoBienId);
    } else {
      const r = await fetch(`${SB}/rest/v1/bienes_muebles`,{
        method:'POST',
        headers:{...H(),'Prefer':'return=representation'},
        body:JSON.stringify({...datos,patrimonio_id:edificioActual,foto_url:null})
      });
      if(!r.ok) throw new Error(await r.text());
      const [nuevo] = await r.json();
      bienesActuales.push(nuevo);
      mostrarToast('✅ Bien añadido');
      cerrarModalBien();
      renderPanel();
      seleccionado=nuevo.id;
      mostrarFicha(nuevo.id);
    }
  } catch(e){ mostrarToast('❌ Error: '+e.message,4000); }
  btn.disabled=false; btn.textContent='💾 Guardar cambios';
}

async function borrarBien(){
  if(!confirm('¿Eliminar este bien? Esta acción no se puede deshacer.')) return;
  try {
    await fetch(`${SB}/rest/v1/bienes_muebles?id=eq.${editandoBienId}`,{method:'DELETE',headers:H()});
    bienesActuales = bienesActuales.filter(x=>x.id!==editandoBienId);
    cerrarModalBien();
    renderPanel();
    if(bienesActuales.length>0){ seleccionado=bienesActuales[0].id; mostrarFicha(seleccionado); }
    else document.getElementById('main-content').innerHTML='<div style="padding:40px;text-align:center;color:var(--texto-muted)">Sin bienes catalogados</div>';
    mostrarToast('🗑 Bien eliminado');
  } catch(e){ mostrarToast('❌ Error al eliminar'); }
}

// ============================================
// AUTH
// ============================================
function abrirLogin(){ document.getElementById('modal-login').classList.add('visible'); }
function cerrarLogin(){ document.getElementById('modal-login').classList.remove('visible'); }

async function hacerLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('login-btn');
  if(!email||!pass){ msg.textContent='Rellena email y contraseña'; return; }
  btn.disabled=true; btn.textContent='Accediendo...';
  try {
    const r = await fetch(`${SB}/auth/v1/token?grant_type=password`,{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':KEY},
      body:JSON.stringify({email,password:pass})
    });
    const data = await r.json();
    if(r.ok && data.access_token){
      TOKEN = data.access_token; USUARIO = email;
      sessionStorage.setItem('sb_token',TOKEN);
      sessionStorage.setItem('sb_user',USUARIO);
      document.getElementById('admin-badge').textContent = '● '+email;
      document.getElementById('admin-badge').style.display = 'inline-block';
      document.getElementById('btn-login').style.display = 'none';
      cerrarLogin();
      if(seleccionado) mostrarFicha(seleccionado);
      // Tras login, sembrar datos si faltan y recargar
      await verificarSeed();
      if(edificioActual) await cargarBienes(edificioActual);
      else if(edificioIdUrl) await cargarEdificioDirecto(edificioIdUrl);
      mostrarToast('✅ Sesión iniciada');
    } else {
      msg.style.color='#EF4444';
      msg.textContent = 'Email o contraseña incorrectos';
    }
  } catch(e){ msg.textContent='Error de conexión'; }
  btn.disabled=false; btn.textContent='Acceder';
}

function detectarSesion(){
  const token = sessionStorage.getItem('sb_token');
  const user = sessionStorage.getItem('sb_user');
  if(token && user){
    TOKEN=token; USUARIO=user;
    document.getElementById('admin-badge').textContent='● '+user;
    document.getElementById('admin-badge').style.display='inline-block';
    document.getElementById('btn-login').style.display='none';
  }
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrarModalBien();});

// ============================================
// TOAST
// ============================================
function mostrarToast(msg, dur=2500){
  const t = document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  clearTimeout(window._tT);
  window._tT=setTimeout(()=>t.style.display='none',dur);
}

// ============================================
// INICIO
// ============================================
detectarSesion();

// Leer ID de edificio desde URL
const urlParams = new URLSearchParams(window.location.search);
const edificioIdUrl = urlParams.get('id');

if(edificioIdUrl){
  // Venir directo desde patrimonio con un edificio concreto
  cargarEdificioDirecto(edificioIdUrl);
} else {
  // Mostrar selector
  cargarEdificios();
}

async function cargarEdificioDirecto(id){
  try {
    const r = await fetch(`${SB}/rest/v1/patrimonio?id=eq.${id}&select=id,nombre,tipo`,{headers:H()});
    const data = await r.json();
    if(data.length > 0){
      const e = data[0];
      // Sembrar datos solo si hay token (admin logado)
      if(TOKEN) await verificarSeed();
      await abrirEdificio(e.id, e.nombre);
      return;
    }
  } catch(err){}
  cargarEdificios();
}
